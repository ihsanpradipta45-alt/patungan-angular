<main class="container py-4" style="max-width: 560px">
  <h1 class="fw-bold mb-0">Patungan</h1>
  <p class="text-muted small mb-4">
    {{ judul }}, {{ tanggal | date: 'EEEE, d MMMM yyyy' }}
  </p>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <h2 class="h6 fw-semibold mb-0">Daftar item</h2>
    <button type="button" class="btn btn-link btn-sm p-0" (click)="kosongkan()">
      Kosongkan daftar
    </button>
  </div>

  <div>
    @for (item of items(); track item.id; let i = $index) {
      <app-item-row
        [item]="item"
        [no]="i + 1"
        (ubahQty)="ubahQty(item.id, $event)"
        (hapus)="hapus($event)"
      />
    } @empty {
      <p class="text-muted small text-center py-3 mb-0">Belum ada item.</p>
    }
  </div>

  <p class="text-end fw-semibold small mt-2 mb-0">
    Subtotal: {{ subtotal() | currency: 'IDR' : 'symbol-narrow' : '1.0-0' }}
  </p>

  <app-item-form (tambah)="tambah($event)" />

  <app-split-summary
    [subtotal]="subtotal()"
    [jumlahOrang]="jumlahOrang()"
    [pajakPersen]="pajakPersen()"
    (ubahOrang)="ubahOrang($event)"
    (ubahPajak)="ubahPajak($event)"
  />
</main>
